<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Anganwadi Connect</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--g:#145B36;--dg:#0D472B;--mint:#BDE9DD;--sage:#E7F3EC;--bg:#F7FAF7;--tx:#10281B;--mu:#5B6F63;--ln:#D5E4DA;--page:#E4EBE6}
@media(prefers-color-scheme:dark){:root{--page:#0E1511}}
:root[data-theme=dark]{--page:#0E1511}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--page);display:flex;align-items:center;justify-content:center;font-family:"Segoe UI",system-ui,-apple-system,sans-serif;overflow:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.phone{width:413px;height:872px;border-radius:64px;background:#111;padding:10px;position:relative;flex:none;box-shadow:0 0 0 2px #333,0 20px 50px rgba(0,0,0,.35);transform-origin:center}
.scr{width:393px;height:852px;border-radius:54px;background:var(--bg);overflow:hidden;position:relative;display:flex;flex-direction:column;color:var(--tx)}
.isl{position:absolute;top:11px;left:50%;width:120px;height:34px;margin-left:-60px;background:#000;border-radius:20px;z-index:9}
.sb{height:54px;flex:none;display:flex;justify-content:space-between;align-items:flex-end;padding:0 34px 6px;font-size:15px;font-weight:600}
.hd{flex:none;display:flex;align-items:center;gap:10px;padding:8px 18px 10px}
.hd h1{font-size:17px;margin:0;color:var(--dg);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:40px;height:40px;border-radius:50%;border:1px solid var(--ln);background:#fff;font-size:18px;cursor:pointer;color:var(--g)}
.body{flex:1;overflow:auto;padding:4px 18px 18px}
.nav{flex:none;display:flex;background:#fff;border-top:1px solid var(--ln);padding:8px 6px 22px}
.nav button{flex:1;border:0;background:none;font-size:11px;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:2px;min-height:48px;cursor:pointer}
.nav button span{font-size:20px}.nav .on{color:var(--g);font-weight:700}.nav .on span{background:var(--sage);border-radius:14px;padding:0 14px}
.card{background:#fff;border:1px solid var(--ln);border-radius:16px;padding:14px;margin:10px 0}
.card.tap{cursor:pointer}.card.tap:active{background:var(--sage)}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}
h2{font-size:16px;margin:16px 0 4px;color:var(--dg)}h3{font-size:15px;margin:0}
.mu{color:var(--mu);font-size:13px}.big{font-size:26px;font-weight:700;color:var(--g)}
.btn,.btn2{display:block;width:100%;min-height:48px;border-radius:24px;font-size:15px;font-weight:600;cursor:pointer;margin:8px 0;border:1.5px solid var(--g)}
.btn{background:var(--g);color:#fff}.btn2{background:#fff;color:var(--g)}.btn:disabled{opacity:.6}
.chip{display:inline-block;padding:7px 14px;border-radius:18px;background:var(--sage);color:var(--g);font-size:13px;margin:3px 4px 3px 0;border:1px solid var(--ln);cursor:pointer}
.chip.on{background:var(--g);color:#fff}
.tag{font-size:11px;padding:3px 9px;border-radius:10px;background:var(--mint);color:var(--dg);font-weight:600}.tag.w{background:#FFF1CC;color:#5A4300}
.av{width:44px;height:44px;border-radius:50%;background:var(--mint);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--dg);flex:none}
.sample{background:var(--sage);border-radius:10px;font-size:11.5px;color:var(--mu);padding:7px 10px;margin:6px 0}
input,select,textarea{width:100%;min-height:46px;border:1px solid var(--ln);border-radius:12px;padding:10px 12px;font-size:15px;margin:4px 0 8px;background:#fff;color:var(--tx);font-family:inherit}
label{font-size:13px;font-weight:600;color:var(--dg)}.err{color:#A02020;font-size:13px;min-height:18px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal b{font-size:11px;color:var(--mu)}.cal i{font-style:normal;height:40px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:12px;font-size:14px;cursor:pointer;position:relative}
.cal i.ev:after{content:"";width:5px;height:5px;background:var(--g);border-radius:50%;position:absolute;bottom:3px}
.cal i.sel{background:var(--g);color:#fff}.cal i.sel:after{background:#fff}.cal i.td{border:1.5px solid var(--g)}
.bub{max-width:80%;padding:10px 13px;border-radius:16px;margin:6px 0;font-size:14px}
.me{background:var(--g);color:#fff;margin-left:auto;border-bottom-right-radius:4px}.th{background:#fff;border:1px solid var(--ln);border-bottom-left-radius:4px}
.toast{position:absolute;left:18px;right:18px;bottom:100px;background:var(--dg);color:#fff;padding:13px 16px;border-radius:14px;font-size:14px;z-index:8;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.paper{background:#fff;border:1px dashed var(--g);border-radius:8px;padding:14px;font-size:13px;line-height:1.5}
.bar{height:8px;border-radius:4px;background:var(--sage);overflow:hidden}.bar div{height:100%;background:var(--g)}
.hero{background:linear-gradient(160deg,var(--g),var(--dg));color:#fff;border-radius:20px;padding:20px;margin:10px 0}
.hero .big{color:#fff}.hero .mu{color:var(--mint)}
</style></head><body>
<div class="phone" id="ph"><div class="scr"><div class="isl"></div><div class="sb"><span>9:41</span><span>5G ▮▮▮</span></div><div id="app" style="flex:1;display:flex;flex-direction:column;min-height:0"></div></div></div>
<script>
const T={home:['Home','होम'],records:['Records','रिकॉर्ड'],att:['Attendance','उपस्थिति'],cal:['Calendar','कैलेंडर'],rep:['Reports','रिपोर्ट'],child:['Child','बच्चा'],learn:['Learning','सीखें'],chat:['Chat','चैट'],preg:['My Pregnancy','मेरी गर्भावस्था'],health:['Health','स्वास्थ्य'],A:['Anganwadi Worker','आंगनवाड़ी कार्यकर्ता'],P:['Parent / Guardian','अभिभावक'],M:['Pregnant Woman','गर्भवती महिला'],hi:['Namaste','नमस्ते'],save:['Save changes','बदलाव सहेजें']};
const NAV={A:['home','records','att','cal','rep'],P:['home','child','learn','cal','chat'],M:['home','preg','health','cal','chat']};
const IC={home:'🏠',records:'📋',att:'✅',cal:'📅',rep:'📊',child:'👶',learn:'📚',chat:'💬',preg:'🤰',health:'❤️'};
const C=[{id:'c1',n:'Aarav Sharma',a:'3y 4m',ht:94,g:[['Jul',12.4],['Aug',12.7],['Sep',13.1],['Oct',13.6]],v:[['OPV Booster','03 Jun 2026','Given'],['DPT Booster 1','15 Aug 2026','Given'],['Measles-Rubella 2','12 Nov 2026','Due']]},
{id:'c2',n:'Pooja Patel',a:'2y 9m',ht:88,g:[['Jul',10.6],['Aug',10.9],['Sep',11.1],['Oct',11.4]],v:[['OPV Booster','21 May 2026','Given'],['DPT Booster 1','Not recorded','Pending']]}];
const W=[{id:'w1',n:'Meena Devi',wk:28,tri:2,edd:'29 Jan 2027',wt:[['Wk 10',52.4],['Wk 16',54.1],['Wk 22',56.3],['Wk 28',58.5]],ck:[['ANC 1','03 Jul 2026','110/70','52.4','Registration, IFA tablets started'],['ANC 2','14 Aug 2026','112/72','54.1','Tetanus (Td) dose 1 given'],['ANC 3','25 Sep 2026','116/76','56.3','Ultrasound advised at PHC']],im:['Td-1 · 14 Aug 2026 · Given','Td-2 · Not recorded'],fu:[]},
{id:'w2',n:'Anjali Verma',wk:34,tri:3,edd:'18 Dec 2026',wt:[['Wk 12',60.2],['Wk 20',62.4],['Wk 28',64.0],['Wk 34',65.2]],ck:[['ANC 1','10 Mar 2026','108/70','60.2','Registration']],im:['Td-1 · 02 Apr 2026 · Given'],fu:[]}];
const ART=[['Vitamin D for strong bones','Nutrition','About 15–20 minutes of morning sunlight, along with foods such as eggs and fortified milk, supports bone growth in children. Ask your Anganwadi Worker about supplements; do not start any on your own.'],['Iron-rich foods in pregnancy','Nutrition','Green leafy vegetables, jaggery, lentils and the IFA tablets given at the centre support iron intake. Take IFA tablets as advised by your health worker or doctor.'],['Play & learn at home','Development','Simple songs, counting seeds, and sorting objects build language and thinking skills for ages 3–5.']];
const EV={9:[['VHSND session','Village health & nutrition day · Courtyard 10 AM','APM'],],12:[['ANC checkup #4','Rampur PHC · 10:00 AM','AM']],14:[['Growth monitoring day','Weigh & measure all enrolled children','AP']],20:[['Parent-teacher meeting','Anganwadi centre · 3 PM','AP']],24:[['Immunization drive','Measles-Rubella camp','AP']]};
const ATD=[['Mon 02 Nov','Present','Arrived 9:10 AM'],['Tue 03 Nov','Present','Hot-cooked meal taken'],['Wed 04 Nov','Absent','Parent informed: fever'],['Thu 05 Nov','Present','Early learning session']];
const S={lang:0,role:null,tab:'home',st:[],seg:'c',cc:'c1',wc:'w1',cd:6,att:{c1:'P',c2:null},rt:0,rr:0,pv:0,busy:0,toast:'',
watt:{},msg:{P:[['t','Namaste! Aarav is doing well this week.']],M:[['t','Namaste Meena ji, your next ANC visit is on 12 Nov.']]}};
const t=k=>T[k][S.lang];const $=id=>document.getElementById(id);
const E=k=>E0(k).filter(e=>S.role!='A'||e[2].includes(S.seg=='c'?'P':'M'));const E0=(k,u)=>(EV[k]||[]).filter(e=>e[2].includes(S.role)).concat(S.role=='A'||S.role=='M'?W.flatMap(w=>w.fu.filter(f=>f.d==k&&(S.role=='A'||w.id=='w1')).map(f=>['Follow-up: '+w.n,f.note,'AM'])):[]);
const cur=()=>S.st[S.st.length-1];
const go=(s,p)=>{S.st.push({s,p});R()},back=()=>{S.st.pop();R()},tab=k=>{S.tab=k;S.st=[];R()};
const say=m=>{S.toast=m;R();setTimeout(()=>{S.toast='';R()},2600)};
const ch=()=>C.find(c=>c.id==S.cc),wm=()=>W.find(w=>w.id==S.wc);
const spark=a=>{const v=a.map(x=>x[1]),mn=Math.min(...v),mx=Math.max(...v),p=a.map((x,i)=>[20+i*(280/(a.length-1)),70-(x[1]-mn)/(mx-mn||1)*50]);return `<svg viewBox="0 0 320 100" width="100%" role="img" aria-label="Trend chart"><polyline fill="none" stroke="#145B36" stroke-width="3" points="${p.map(x=>x.join(',')).join(' ')}"/>${p.map((q,i)=>`<circle cx="${q[0]}" cy="${q[1]}" r="5" fill="#145B36"/><text x="${q[0]}" y="95" font-size="11" text-anchor="middle" fill="#5B6F63">${a[i][0]}</text><text x="${q[0]}" y="${q[1]-9}" font-size="11" text-anchor="middle" fill="#10281B">${a[i][1]}</text>`).join('')}</svg>`};
const sm='<div class="sample">Sample data only — fictional records for prototype demonstration, not verified medical information.</div>';
const row=(a,b,c,fn)=>`<div class="card tap" onclick="${fn}"><div class="row sp"><div><h3>${a}</h3><div class="mu">${b||''}</div></div>${c||'›'}</div></div>`;
// ---- shared screens
function cal(){const days=[...Array(30)].map((_,i)=>i+1);const ev=E(S.cd);return `<h2 style="margin-top:0">November 2026</h2><div class="card"><div class="cal">${'SMTWTFS'.split('').map(d=>`<b>${d}</b>`).join('')}<span></span>${days.map(d=>`<i class="${E(d).length?'ev':''} ${d==S.cd?'sel':''} ${d==6?'td':''}" onclick="S.cd=${d};R()">${d}</i>`).join('')}</div></div><h2>${S.cd} Nov 2026</h2>${ev.length?ev.map((e,i)=>row(e[0],e[1],'›',`go('evd',{d:${S.cd},i:${i}})`)).join(''):'<div class="card mu">No appointments or activities on this date.</div>'}`}
function chat(){return `<div class="card"><h3>Conversation list</h3></div>`+row('Rekha Devi (AWW)',S.msg[S.role].slice(-1)[0][1].slice(0,38)+'…','<span class="tag">1</span>',"go('conv')")+`<div class="sample">Prototype chat — messages are simulated and not sent anywhere.</div>`}
function reps(){const ty=S.role=='A'?(S.seg=='c'?['Child growth','Attendance','Vaccination']:['Maternal ANC','Weight history','Immunization']):S.role=='P'?['Growth summary','Vaccination record','Attendance']:['ANC summary','Weight history','Immunization'];const rg=['Last month','Last 3 months','Full year'];
return `<div class="card"><label>Report type</label><div>${ty.map((x,i)=>`<span class="chip ${i==S.rt?'on':''}" onclick="S.rt=${i};S.pv=0;R()">${x}</span>`).join('')}</div><label>Date range</label><div>${rg.map((x,i)=>`<span class="chip ${i==S.rr?'on':''}" onclick="S.rr=${i};S.pv=0;R()">${x}</span>`).join('')}</div></div><button class="btn2" onclick="S.pv=1;R()">Preview report</button>${S.pv?`<div class="paper"><b>${ty[S.rt]} — ${rg[S.rr]}</b><br>Anganwadi Connect · AWC Rampur<br>${S.role=='M'?'Meena Devi':S.role=='P'?'Aarav Sharma':'All enrolled beneficiaries'}<br><br>Sample figures for demonstration only. Weight: ${S.role=='M'?'58.5 kg (Wk 28)':'13.6 kg (Oct 2026)'}.</div><button class="btn" onclick="say('Report ready (simulated download — no file is saved)')">Download report</button>`:''}`}
// ---- screens
const V={
welcome:()=>`<div class="body" style="display:flex;flex-direction:column;justify-content:center;text-align:center"><div class="av" style="width:84px;height:84px;margin:0 auto;font-size:36px">🌱</div><h1 style="color:var(--dg);margin:14px 0 4px">Anganwadi Connect</h1><p class="mu">Community health and child development, in one place.</p><label>Choose language / भाषा चुनें</label><div><span class="chip ${!S.lang?'on':''}" onclick="S.lang=0;R()">English</span><span class="chip ${S.lang?'on':''}" onclick="S.lang=1;R()">हिन्दी</span></div><button class="btn" onclick="go('role')">${S.lang?'आगे बढ़ें':'Continue'}</button><div class="sample">Prototype with demo access. No real login, government database or notifications are connected.</div></div>`,
role:()=>`<div class="hd"><button class="ib" onclick="back()" aria-label="Back">‹</button><h1>${S.lang?'अपनी भूमिका चुनें':'Choose your role'}</h1></div><div class="body">${['A','P','M'].map(r=>row(t(r),{A:'Manage records, attendance and follow-ups',P:'Track your child’s growth, vaccines and learning',M:'Follow your pregnancy, checkups and nutrition'}[r],'›',`go('login',{r:'${r}'})`)).join('')}</div>`,
login:p=>`<div class="hd"><button class="ib" onclick="back()" aria-label="Back">‹</button><h1>Demo access</h1></div><div class="body"><div class="card"><h3>${t(p.r)}</h3><div class="mu">Sample account: ${{A:'Rekha Devi · AWW, AWC Rampur',P:'Sunita Sharma · parent of Aarav',M:'Meena Devi · Week 28'}[p.r]}</div></div><button class="btn" onclick="S.role='${p.r}';S.tab='home';S.st=[];S.rt=0;S.pv=0;R()">Enter demo dashboard</button></div>`,
A_home:()=>`<div class="row" role="tablist" style="background:var(--sage);border-radius:26px;padding:4px;gap:4px"><button role="tab" aria-selected="${S.seg=='c'}" class="btn ${S.seg=='c'?'':'btn2'}" style="margin:0;border:0;flex:1" onclick="S.seg='c';R()">Children</button><button role="tab" aria-selected="${S.seg=='w'}" class="btn ${S.seg=='w'?'':'btn2'}" style="margin:0;border:0;flex:1" onclick="S.seg='w';R()">Pregnant Women</button></div>${alerts()}<div class="hero"><div class="mu">${t('hi')}, Rekha Devi</div><div class="big">38 / 42 present</div><div class="mu">Today’s attendance · AWC Rampur</div></div><div class="row"><div class="card tap" style="flex:1" onclick="S.seg='c';tab('records')"><div class="big">${C.length}</div><div class="mu">Children (sample)</div></div><div class="card tap" style="flex:1" onclick="S.seg='w';tab('records')"><div class="big">${W.length}</div><div class="mu">Pregnant women</div></div></div><h2>${S.seg=='c'?'Children records':'Pregnant women records'}</h2>${S.seg=='c'?C.map(c=>row(c.n,c.a+' · '+c.g[3][1]+' kg',null,`S.cc='${c.id}';go('cprof')`)).join(''):W.map(w=>row(w.n,`Week ${w.wk} · Trimester ${w.tri} · EDD ${w.edd}`,null,`S.wc='${w.id}';go('wprof')`)).join('')}<button class="btn" onclick="tab('records')">View all ${S.seg=='c'?'children':'pregnant women'} records</button>${S.seg=='w'?'<button class="btn2" onclick="go(\'addw\')">Register pregnant woman</button>':''}<h2>Upcoming</h2>${row('ANC checkup #4 · Meena Devi','12 Nov · Rampur PHC','›',"S.cd=12;tab('cal')")}${row('Growth monitoring day','14 Nov','›',"S.cd=14;tab('cal')")}`,
A_records:()=>`<div><span class="chip ${S.seg=='c'?'on':''}" onclick="S.seg='c';R()">Children</span><span class="chip ${S.seg=='w'?'on':''}" onclick="S.seg='w';R()">Pregnant Women</span></div>${sm}${S.seg=='c'?C.map(c=>row(c.n,c.a+' · '+c.g[3][1]+' kg',null,`S.cc='${c.id}';go('cprof')`)).join(''):W.map(w=>row(w.n,`Week ${w.wk} · Trimester ${w.tri} · EDD ${w.edd}`,null,`S.wc='${w.id}';go('wprof')`)).join('')}`,
A_att:()=>S.seg=='c'?V.A_attc():V.A_attw(),
A_attw:()=>`<h2 style="margin-top:0">ANC session & home-visit attendance · 06 Nov 2026</h2>${W.map(w=>`<div class="card"><div class="row sp"><h3>${w.n}</h3><span class="tag ${S.watt[w.id]?'':'w'}">${S.watt[w.id]=='P'?'Attended':S.watt[w.id]=='A'?'Missed':'Not marked'}</span></div><div class="row"><button class="btn2" onclick="S.watt['${w.id}']='P';R()">Attended</button><button class="btn2" onclick="S.watt['${w.id}']='A';R()">Missed</button></div></div>`).join('')}<button class="btn" onclick="say('Attendance saved (sample data)')">Save attendance</button>`,
A_attc:()=>`<h2 style="margin-top:0">Fri 06 Nov 2026</h2>${C.map(c=>`<div class="card"><div class="row sp"><h3>${c.n}</h3><span class="tag ${S.att[c.id]?'':'w'}">${S.att[c.id]=='P'?'Present':S.att[c.id]=='A'?'Absent':'Not marked'}</span></div><div class="row"><button class="btn2" onclick="S.att['${c.id}']='P';R()">Present</button><button class="btn2" onclick="S.att['${c.id}']='A';R()">Absent</button></div></div>`).join('')}<button class="btn" onclick="say('Attendance saved (sample data)')">Save attendance</button>`,
A_cal:cal,A_rep:reps,
cprof:()=>{const c=ch();return `<div class="card"><div class="row"><div class="av">${c.n[0]}</div><div><h3>${c.n}</h3><div class="mu">${c.a} · Height ${c.ht} cm</div></div></div></div>${sm}<div class="card">${spark(c.g)}<div class="mu">Weight in kg, Jul–Oct 2026</div></div>${row('Growth records','Historical measurements',null,"go('growth')")}${S.role=='A'?'':row('Attendance','Recent days',null,"go('attl')")}${row('Vaccinations',c.v.length+' records',null,"go('vacl')")}`},
growth:()=>{const c=ch();return sm+c.g.map((g,i)=>row(g[0]+' 2026',g[1]+' kg',null,`go('meas',{i:${i}})`)).join('')},
meas:p=>{const c=ch(),g=c.g[p.i];return `<div class="card"><div class="mu">Measurement date</div><h3>${g[0]} 2026</h3><div class="big">${g[1]} kg</div><div class="mu">Recorded at AWC Rampur by AWW Rekha Devi. No reference range is shown in this prototype.</div></div>${S.role=='A'?`<button class="btn" onclick="go('editw',{i:${p.i}})">Edit record</button>`:''}`},
editw:p=>`<div class="card"><label>Weight (kg)</label><input id="f1" inputmode="decimal" value="${ch().g[p.i][1]}"><div class="err" id="er"></div><button class="btn" onclick="sv(${p.i})">${t('save')}</button><button class="btn2" onclick="back()">Cancel</button></div>`,
vacl:()=>sm+ch().v.map((v,i)=>row(v[0],v[1],`<span class="tag ${v[2]=='Given'?'':'w'}">${v[2]}</span>`,`go('vacd',{i:${i}})`)).join(''),
vacd:p=>{const v=ch().v[p.i];return `<div class="card"><h3>${v[0]}</h3><div class="mu">Child: ${ch().n}</div><p>Date: <b>${v[1]}</b><br>Status: <b>${v[2]}</b><br>Place: AWC Rampur / PHC</p><div class="mu">Status shown from sample data. Confirm with the health centre.</div></div>`},
attl:()=>ATD.map((a,i)=>row(a[0],a[2],`<span class="tag ${a[1]=='Present'?'':'w'}">${a[1]}</span>`,`go('attd',{i:${i}})`)).join(''),
attd:p=>{const a=ATD[p.i];return `<div class="card"><h3>${a[0]}</h3><div class="big">${a[1]}</div><div class="mu">${a[2]}</div></div>`},
wprof:()=>{const w=wm();return `<div class="card"><div class="row"><div class="av">${w.n[0]}</div><div><h3>${w.n}</h3><div class="mu">Week ${w.wk} · Trimester ${w.tri} · EDD ${w.edd}</div></div></div></div>${sm}${w.wt.length>1?`<div class="card">${spark(w.wt)}<div class="mu">Weight in kg</div></div>`:'<div class="card mu">No weight measurements recorded yet.</div>'}${row('Checkup history',w.ck.length+' visits',null,"go('ckl')")}${row('Immunization',w.im.length+' records',null,"go('iml')")}${row('Follow-ups',w.fu.length?w.fu.length+' scheduled':'None yet',null,"go('ful')")}${S.role=='A'?`<button class="btn" onclick="go('addfu')">Add follow-up</button>`:''}`},
ckl:()=>sm+(wm().ck.length?'':'<div class="card mu">No checkups recorded yet.</div>')+wm().ck.map((c,i)=>row(c[0],c[1],null,`go('ckd',{i:${i}})`)).join(''),
ckd:p=>{const c=wm().ck[p.i];return `<div class="card"><h3>${c[0]} — ${c[1]}</h3><p>Blood pressure: <b>${c[2]} mmHg</b><br>Weight: <b>${c[3]} kg</b><br>Notes: ${c[4]}</p><div class="mu">No normal/abnormal label is given; discuss results with your doctor.</div></div>${S.role=='A'?`<button class="btn2" onclick="go('addfu')">Add follow-up</button>`:''}`},
iml:()=>wm().im.map(x=>`<div class="card">${x}</div>`).join('')+sm,
ful:()=>wm().fu.length?wm().fu.map(f=>`<div class="card"><h3>${f.d} Nov 2026</h3><div class="mu">${f.note}</div></div>`).join(''):'<div class="card mu">No follow-ups yet. Your Anganwadi Worker can add one after a visit.</div>',
addfu:()=>`<div class="card"><label>Date (day in Nov 2026, 7–30)</label><input id="f1" inputmode="numeric" placeholder="e.g. 19"><label>Follow-up note</label><textarea id="f2" rows="3"></textarea><div class="err" id="er"></div><button class="btn" onclick="sf()">${t('save')}</button><button class="btn2" onclick="back()">Cancel</button></div>`,
qvac:p=>{const c=p.k=='c',nm=c?ch().n:wm().n,vn=c?ch().v[p.i][0]:wm().im[p.i].split(' · ')[0];return `<div class="card"><h3>${nm}</h3><div class="mu">${vn}</div><label>Date given</label><input id="f1" value="06 Nov 2026"><label>Given at</label><select id="f2"><option>AWC Rampur</option><option>Rampur PHC</option><option>Home visit</option></select><div class="err" id="er"></div><button class="btn" onclick="sq('${p.k}',${p.i})">Mark as given</button><button class="btn2" onclick="back()">Cancel</button></div><div class="sample">Prototype: confirm only after the dose has actually been given. Nothing is sent to a real database.</div>`},
logout:()=>`<div class="card"><h3>Log out of Anganwadi Connect?</h3><p class="mu">You will return to the welcome screen. Unsaved changes are not kept in this prototype.</p></div><button class="btn" onclick="S.role=null;S.st=[{s:'bye'}];R()">Log out</button><button class="btn2" onclick="back()">Cancel</button>`,
bye:()=>`<div class="body" style="display:flex;flex-direction:column;justify-content:center;text-align:center"><div class="av" style="width:84px;height:84px;margin:0 auto;font-size:36px">👋</div><h1 style="color:var(--dg)">You’re logged out</h1><p class="mu">Your demo session has ended.</p><button class="btn" onclick="S.st=[];R()">Log in again</button><button class="btn2" onclick="S.st=[{s:'role'}];R()">Switch role</button></div>`,
addw:()=>`<div class="card"><label>Woman’s name</label><input id="f1"><label>Pregnancy week recorded (4–42)</label><input id="f2" inputmode="numeric"><div class="err" id="er"></div><button class="btn" onclick="sw()">Save record</button><button class="btn2" onclick="back()">Cancel</button></div><div class="sample">Sample registration only. Nothing is sent to a real database.</div>`,
evd:p=>{const e=E(p.d)[p.i];return e?`<div class="card"><h3>${e[0]}</h3><div class="big">${p.d} Nov 2026</div><p>${e[1]}</p></div><button class="btn2" onclick="back()">Back to calendar</button>`:'<div class="card mu">Event not found.</div>'},
conv:()=>`<div id="cv" class="body" style="padding:0 0 8px;height:600px;overflow:auto">${S.msg[S.role].map(m=>`<div class="bub ${m[0]=='m'?'me':'th'}">${m[1]}</div>`).join('')}</div><div class="row"><input id="mi" placeholder="Type a message" style="margin:0" onkeydown="if(event.key=='Enter')sm_()"><button class="btn" style="width:90px;margin:0" onclick="sm_()">Send</button></div>`,
art:p=>`<div class="card"><span class="tag">${ART[p.i][1]}</span><h3 style="margin:8px 0">${ART[p.i][0]}</h3><p style="line-height:1.55">${ART[p.i][2]}</p></div><div class="sample">General information, not medical advice or diagnosis.</div>`,
lib:()=>ART.map((a,i)=>row(a[0],a[1],null,`go('art',{i:${i}})`)).join(''),
baby:()=>`<div class="card"><h3>Baby details · Week 28</h3><p>Size comparison: about the size of an eggplant (approximate guide).<br>Expected delivery: 29 Jan 2027 (sample).</p></div><div class="sample">General information only. Your doctor’s scan is the reference.</div>`,
P_home:()=>`<div class="hero"><div class="mu">${t('hi')}, Sunita</div><div class="big">${ch().n}</div><div class="mu">${ch().a} · AWC Rampur</div></div>${row('Child profile','Growth, attendance, vaccines',null,"tab('child')")}${row('Next: Measles-Rubella 2','12 Nov 2026 · Vaccination update',null,"go('vacl')")}${row('Learning library','Nutrition & development',null,"tab('learn')")}${row('Upcoming activities','Parent-teacher meeting 20 Nov',null,"S.cd=20;tab('cal')")}${row('Reports','Preview and download',null,"go('rep')")}`,
rep:reps,
P_child:()=>V.cprof(),P_learn:()=>V.lib(),P_cal:cal,P_chat:chat,
M_home:()=>`<div class="hero"><div class="mu">${t('hi')}, Meena</div><div class="big">Week 28 · Trimester 2</div><div class="mu">EDD 29 Jan 2027 · recorded by AWW</div></div>${row('My pregnancy','Timeline and baby details',null,"tab('preg')")}${row('Upcoming checkup','ANC #4 · 12 Nov · Rampur PHC',null,"S.cd=12;tab('cal')")}${row('Health records','Weight, checkups, immunization',null,"tab('health')")}${row('Nutrition resources','Read articles',null,"go('lib')")}${row('Reports','Preview and download',null,"go('rep')")}`,
M_preg:()=>{S.wc='w1';return `<div class="hero"><div class="big">Week 28</div><div class="mu">Trimester 2 · 12 weeks to expected date</div><div class="bar" style="margin-top:10px"><div style="width:70%"></div></div></div><button class="btn" onclick="go('baby')">View Baby Details</button><h2>Timeline</h2>${['Trimester 1 · Weeks 1–13 · Completed','Trimester 2 · Weeks 14–27 · Completed','Week 28 · Today · Checkup #4 on 12 Nov','Trimester 3 · from Week 28'].map(x=>`<div class="card">${x}</div>`).join('')}`},
M_health:()=>{S.wc='w1';return sm+`<div class="card">${spark(wm().wt)}<div class="mu">Weight in kg</div></div>${row('Weight history','4 measurements',null,"go('wh')")}${row('Checkup history','3 ANC visits',null,"go('ckl')")}${row('Immunization','Td records',null,"go('iml')")}`},
wh:()=>wm().wt.map((x,i)=>row(x[0],x[1]+' kg',null,`go('whd',{i:${i}})`)).join(''),
whd:p=>`<div class="card"><h3>${wm().wt[p.i][0]}</h3><div class="big">${wm().wt[p.i][1]} kg</div><div class="mu">Recorded by AWW at AWC Rampur.</div></div>`,
M_cal:cal,M_chat:chat};
const TTL={cprof:'Child profile',growth:'Growth records',meas:'Measurement',editw:'Edit weight',vacl:'Vaccinations',vacd:'Vaccination details',attl:'Attendance',attd:'Day details',wprof:'Maternal profile',ckl:'Checkup history',ckd:'Checkup details',iml:'Immunization',ful:'Follow-ups',addfu:'Add follow-up',evd:'Details',logout:'Log out',qvac:'Quick vaccination',addw:'Register pregnant woman',conv:'Rekha Devi (AWW)',art:'Article',lib:'Learning library',baby:'Baby details',rep:'Reports',wh:'Weight history',whd:'Weight details'};
function alerts(){const a=[];if(S.seg=='c')C.forEach(c=>c.v.forEach((v,i)=>{if(v[2]!='Given')a.push([c.n+' · '+v[0]+(v[2]=='Due'?' due '+v[1]:' not recorded'),'Quick vaccination',`S.cc='${c.id}';go('qvac',{k:'c',i:${i}})`])}));else{W.forEach(w=>w.im.forEach((x,i)=>{if(x.includes('Not recorded'))a.push([w.n+' · '+x.split(' · ')[0]+' dose not recorded','Quick vaccination',`S.wc='${w.id}';go('qvac',{k:'w',i:${i}})`])}));a.push(['Meena Devi · ANC checkup #4 due 12 Nov','Add follow-up',"S.wc='w1';go('addfu')"])}return `<div class="card" style="border-color:#E0A030;background:#FFF8E6"><div class="row sp"><b>⚠ Instant action alerts</b><span class="tag w">${a.length}</span></div>${a.map(x=>`<div style="margin-top:10px"><div style="font-size:14px">${x[0]}</div><button class="btn" style="min-height:40px;margin:6px 0 0" onclick="${x[2]}">${x[1]}</button></div>`).join('')||'<div class="mu">No pending alerts.</div>'}</div>`}
function sq(k,i){const d=$('f1').value.trim();if(!d){$('er').textContent='Enter the date the dose was given.';return}if(k=='c'){const v=ch().v[i];v[1]=d;v[2]='Given'}else{const w=wm();w.im[i]=w.im[i].split(' · ')[0]+' · '+d+' · Given'}S.st=[];say('Vaccination recorded. Alert cleared (sample data).')}
function sv(i){if(S.busy)return;const v=parseFloat($('f1').value);if(!(v>2&&v<40)){$('er').textContent='Enter a weight between 2 and 40 kg.';return}S.busy=1;ch().g[i][1]=v;const k=S.st.findIndex(x=>x.s=='cprof');S.busy=0;S.st.length=k+1;say('Saved. Profile updated (prototype, not a real database).')}
function sw(){if(S.busy)return;const n=$('f1').value.trim(),k=parseInt($('f2').value);if(!n||!(k>=4&&k<=42)){$('er').textContent='Enter a name and a week between 4 and 42.';return}const d=new Date(2026,10,6+(40-k)*7),id='w'+(W.length+1);W.push({id,n,wk:k,tri:k<14?1:k<28?2:3,edd:d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}),wt:[],ck:[],im:[],fu:[]});S.wc=id;S.seg='w';S.st=[{s:'wprof'}];say('Record saved. Pregnant woman added (sample).')}
function sf(){if(S.busy)return;const d=parseInt($('f1').value),n=$('f2').value.trim();if(!(d>=7&&d<=30)||!n){$('er').textContent='Enter a valid date (7–30) and a note.';return}wm().fu.push({d,note:n});const k=S.st.findIndex(x=>x.s=='wprof');S.st.length=k+1;say('Follow-up saved. Record updated.')}
function sm_(){const i=$('mi'),v=i.value.trim();if(!v)return;S.msg[S.role].push(['m',v]);R();setTimeout(()=>{S.msg[S.role].push(['t','Thank you, I will reply shortly. (simulated)']);R()},900)}
function R(){let h='',c=cur(),L=S.lang;
if(!S.role){const s=c?c.s:'welcome';h=V[s](c&&c.p)}
else if(c){h=`<div class="hd"><button class="ib" onclick="back()" aria-label="Back">‹</button><h1>${TTL[c.s]||''}</h1></div><div class="body">${V[c.s](c.p)}</div>`+nav()}
else{const k=S.role+'_'+S.tab;h=`<div class="hd"><div class="av">${S.role=='A'?'R':S.role=='P'?'S':'M'}</div><h1>${t(S.tab)}</h1>${S.role=='A'?`<div class="row" role="group" aria-label="Record type" style="gap:0;background:var(--sage);border-radius:20px;padding:2px">${[['c','👶','Children'],['w','🤰','Pregnant women']].map(x=>`<button class="ib" style="width:36px;height:36px;border:0;${S.seg==x[0]?'background:var(--g);color:#fff':'background:none'}" aria-label="${x[2]}" aria-pressed="${S.seg==x[0]}" onclick="S.seg='${x[0]}';S.rt=0;S.pv=0;R()">${x[1]}</button>`).join('')}</div>`:''}<button class="ib" onclick="S.lang=1-S.lang;R()" aria-label="Language">${L?'EN':'हि'}</button><button class="ib" onclick="go('logout')" aria-label="Log out">⎋</button></div><div class="body">${V[k]()}</div>`+nav()}
if(S.toast)h+=`<div class="toast">${S.toast}</div>`;$('app').innerHTML=h;const cv=$('cv');if(cv)cv.scrollTop=1e5;const mi=$('mi');if(mi&&document.activeElement!=mi)mi.focus()}
function nav(){return `<div class="nav">${NAV[S.role].map(k=>`<button class="${!S.st.length&&S.tab==k?'on':''}" onclick="tab('${k}')"><span>${IC[k]}</span>${t(k)}</button>`).join('')}</div>`}
const fit=()=>{const s=Math.min(1,(innerHeight-16)/872,(innerWidth-8)/413);$('ph').style.transform='scale('+s+')'};addEventListener('resize',fit);fit();R();
</script></body></html>
